<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung Lockscreen AU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Kerangka Layar Smartphone 6.7 Inch -->
    <div class="phone-frame-67">
        
        <!-- Samsung One UI Status Bar (Atas) -->
        <div class="samsung-status-bar">
            <div class="status-left">
                <span class="time-status">22:45</span>
            </div>
            <div class="status-right">
                <span class="icon">📶</span>
                <span class="icon">🛜</span>
                <span class="icon battery-text">85%</span>
                <span class="icon battery-icon">🔋</span>
            </div>
        </div>

        <!-- Konten Lockscreen -->
        <div class="lockscreen-content">
            <!-- Ikon Gembok Keamanan -->
            <div class="lock-icon">🔒</div>

            <!-- Jam Digital Utama Khas Samsung (Vertikal) -->
            <div class="samsung-clock">
                <h1 class="clock-time">22:45</h1>
                <p class="clock-date">Sabtu, 7 November</p>
            </div>

            <!-- Notifikasi Contoh di Lockscreen -->
            <div class="notification-pill">
                <div class="notif-dot"></div>
                <span>Tubatu: Pesan baru menunggumu...</span>
            </div>
        </div>

        <!-- Bagian Bawah: Shortcut & Navigasi -->
        <div class="lockscreen-bottom">
            <div class="shortcut-icon left">📞</div>
            
            <!-- Teks Swipe / Petunjuk Unlock -->
            <div class="unlock-hint" onclick="alert('Masuk ke beranda AU / Chat!')">
                Ketuk untuk membuka kunci
            </div>

            <div class="shortcut-icon right">📷</div>
        </div>

        <!-- Navigasi Bawah / Garis Gesture One UI -->
        <div class="oneui-gesture-bar"></div>

    </div>

</body>
</html>
